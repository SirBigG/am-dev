[project]
name = "agromega-parser-studio"
version = "0.1.0"
description = "Local desktop control surface for AgroMega company parser workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.6,<26",
    "lxml>=6,<7",
    "platformdirs>=4.4,<5",
    "pyside6>=6.9,<7",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.15,<1"]

[project.scripts]
agromega-parser-studio = "agromega_parser_studio.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agromega_parser_studio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
