worker_processes 1;
error_log /var/log/nginx/application-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $request_uri $analytics_request_path {
        default /;
        ~^(?<analytics_path_without_query>[^?]*) $analytics_path_without_query;
    }

    map $http_referer $analytics_referrer {
        default "-";
        ~^(?<analytics_referrer_without_query>[^?]*) $analytics_referrer_without_query;
    }

    log_format analytics_json escape=json
        '{"time":"$time_iso8601",'
        '"client_address":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$analytics_request_path",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"referrer":"$analytics_referrer",'
        '"user_agent":"$http_user_agent"}';

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml image/x-icon image/jpeg image/png;

    server {
        listen 8000 default_server;
        server_name localhost nginx agromega.in.ua www.agromega.in.ua;
        charset utf-8;
        client_max_body_size 75M;

        access_log /var/log/nginx/traffic.log analytics_json;

        location /media/ {
            alias /var/www/media/;
            try_files $uri $uri/ =404;
        }

        location /imgproxy/ {
            set $imgproxy_upstream http://imgproxy:8080;
            rewrite ^/imgproxy/(.*) /$1 break;
            proxy_pass $imgproxy_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            alias /static/;
            try_files $uri $uri/ =404;
        }

        location = /forum {
            return 301 /community/;
        }

        location ~ ^/forum/(.*)$ {
            return 301 /community/$1;
        }

        location = /community {
            return 301 /community/;
        }

        location /community/media/ {
            alias /forum-media/;
            try_files $uri $uri/ =404;
        }

        location /community/static/ {
            alias /static/;
            try_files $uri $uri/ =404;
        }

        location /community/ {
            set $forum_upstream http://am-forum-instance:8082;
            rewrite ^/community/(.*)$ /$1 break;
            proxy_pass $forum_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /community;
        }

        location / {
            set $core_upstream http://am-core:8081;
            proxy_pass $core_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
